services:
  filebrowser:
    image: hurlenko/filebrowser
    user: "1000:1000"
    container_name: $NAME
    ports:
      - ${PORT}:8080
    volumes:
      - ${PATH_DATA}:/data
      - filebrowser-config:/config
    environment:
      - FB_BASEURL=/filebrowser
    restart: always
volumes:
  filebrowser-config:
